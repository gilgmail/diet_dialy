version: '3.9'

services:
  web-dev:
    image: node:20
    container_name: diet-daily-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port ${PI_DEV_PORT:-3100}"
    ports:
      - "${PI_DEV_PORT:-3100}:3100"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - ../.env.production.pi
    volumes:
      - ..:/app
      - web-dev-node-modules:/app/node_modules
    restart: unless-stopped

volumes:
  web-dev-node-modules:

name: Mobile TypeScript Check

on:
  push:
    paths:
      - 'mobile/react-native-starter-kit/DietDailyMobile/**'
      - '.github/workflows/mobile-tsc.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'mobile/react-native-starter-kit/DietDailyMobile/**'
      - '.github/workflows/mobile-tsc.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  tsc-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/react-native-starter-kit/DietDailyMobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/react-native-starter-kit/DietDailyMobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile (no emit)
        run: npx tsc --noEmit
